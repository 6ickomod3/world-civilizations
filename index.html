  const regions = [&quot;West Asia&quot;, &quot;Africa&quot;, &quot;Europe&quot;, &quot;South Asia&quot;, &quot;East Asia&quot;, &quot;SE Asia&quot;, &quot;Americas&quot;];

  function choose(id) {

  function drawMap(selected) {
    const svg = d3.select(root.querySelector(&quot;#civ-map&quot;));
    const width = Math.max(280, root.clientWidth);
    const height = Math.min(255, Math.round(width * .48));
    svg.attr(&quot;viewBox&quot;, `0 0 ${width} ${height}`).attr(&quot;height&quot;, height);

    svg.append(&quot;title&quot;).text(&quot;Selected world historical periods by time and geographic core&quot;);
    svg.append(&quot;desc&quot;).text(&quot;Each horizontal bar is an approximate historical phase. Labels are grouped by core region. Dark bars overlap the selected year; orange marks the selected period. All entries can be selected through the dropdown.&quot;);

    const layouts = [];
    for (const region of regions) {
      const tracks = [];
      const rows = [];
      for (const p of periods.filter(p =&gt; p.region === region).sort((a,b) =&gt; a.start-b.start)) {

    }
    svg.append(&quot;text&quot;).attr(&quot;class&quot;,&quot;axis-title&quot;).attr(&quot;data-axis&quot;,&quot;y&quot;).attr(&quot;x&quot;,0).attr(&quot;y&quot;,19).text(&quot;Core region&quot;);
    svg.append(&quot;text&quot;).attr(&quot;class&quot;,&quot;axis-title&quot;).attr(&quot;data-axis&quot;,&quot;x&quot;).attr(&quot;x&quot;,(left+right)/2).attr(&quot;y&quot;,height-7).attr(&quot;text-anchor&quot;,&quot;middle&quot;).text(&quot;Time (BCE / CE)&quot;);
    const now = x(currentYear);
    svg.append(&quot;line&quot;).attr(&quot;x1&quot;,now).attr(&quot;x2&quot;,now).attr(&quot;y1&quot;,30).attr(&quot;y2&quot;,nextY).attr(&quot;stroke&quot;,&quot;var(--foreground)&quot;).attr(&quot;stroke-width&quot;,1.5);
    for (const layout of layouts) {
      const label = svg.append(&quot;text&quot;).attr(&quot;x&quot;,0).attr(&quot;y&quot;,layout.startY+9);
      const words = layout.region.split(&quot; &quot;);
      words.forEach((word,i) =&gt; label.append(&quot;tspan&quot;).attr(&quot;x&quot;,0).attr(&quot;dy&quot;,i ? 14 : 0).text(word));
      for (const row of layout.rows) {
        const {p,start,end,center,y} = row;
        const isSelected = p.id === selectedId;
        const fill = isSelected ? &quot;var(--viz-series-2)&quot; : activeAtYear(p) ? &quot;var(--viz-series-1)&quot; : &quot;var(--muted-foreground)&quot;;
        svg.append(&quot;rect&quot;).attr(&quot;x&quot;,start).attr(&quot;y&quot;,y).attr(&quot;width&quot;,end-start).attr(&quot;height&quot;,8).attr(&quot;fill&quot;,fill).attr(&quot;opacity&quot;,isSelected || activeAtYear(p) ? 1 : .28);
        svg.append(&quot;text&quot;).attr(&quot;x&quot;,center).attr(&quot;y&quot;,y+25).attr(&quot;text-anchor&quot;,&quot;middle&quot;).text(p.short);
        const hitLeft = Math.max(left, Math.min(start,center-20));

        svg.append(&quot;rect&quot;).attr(&quot;x&quot;,hitLeft).attr(&quot;y&quot;,y-3).attr(&quot;width&quot;,hitRight-hitLeft).attr(&quot;height&quot;,33).attr(&quot;fill&quot;,&quot;transparent&quot;).attr(&quot;class&quot;,&quot;cursor-interaction&quot;).attr(&quot;data-tooltip&quot;,`${p.name}: ${formatRange(p)}`).on(&quot;click&quot;,() =&gt; choose(p.id));
      }
    }
  }
  yearInput.addEventListener(&quot;input&quot;, () =&gt; {
    currentYear = Number(yearInput.value);
    const selected = periods.find(p =&gt; p.id === selectedId);
    if (!activeAtYear(selected)) {

      }
    }
  } catch {
    storage = null;
  }
  const initialGlobals = {
    widgetState: state,
    statePersistence: storage == null ? "none" : "local",
  };

  const channel = new MessageChannel();
  channel.port1.addEventListener("message", (event) => {
    const data = event.data;
    if (typeof data !== "object" || data == null) {
      return;
    }
    if (data.type === "widget-state-write") {
      if (!Number.isSafeInteger(data.id) || data.id <= 0) {
        return;
      }
      let ok = false;
      try {
        if (storage != null) {
          const state = parseState(data.state);
          storage.setItem(storageKey, JSON.stringify(state));
          ok = true;
        }
      } catch {
        // Storage denial, quota limits, and invalid state return a failed receipt.
      }
      channel.port1.postMessage({
        type: "widget-state-result",
        id: data.id,
        ok,
      });
      return;
    }
    if (data.type === "height") {
      const height = data.height;
      if (
        typeof height === "number" &&
        Number.isFinite(height) &&
        height >= 0 &&
        height <= 10_000
      ) {
        frame.style.height = Math.ceil(height) + "px";
      }
      return;
    }
    if (data.type === "scroll-to") {
      const top = data.top;
      if (
        typeof top === "number" &&
        Number.isFinite(top) &&
        top >= 0 &&
        globalThis.navigator.userActivation?.isActive === true
      ) {
        globalThis.scrollTo({
          top: Math.ceil(
            globalThis.scrollY + frame.getBoundingClientRect().top + top,
          ),
        });
      }
      return;
    }
    if (data.type === "open-external") {
      const rawHref = data.href;
      if (typeof rawHref !== "string") {
        return;
      }
      let href;
      try {
        const url = new URL(rawHref, document.baseURI);
        if (url.protocol !== "https:") {
          return;
        }
        href = url.href;
      } catch {
        return;
      }
      if (globalThis.navigator.userActivation?.isActive === true) {
        const anchor = document.createElement("a");
        anchor.href = href;
        anchor.rel = "noopener noreferrer";
        anchor.target = "_blank";
        document.body.appendChild(anchor);
        anchor.click();
        anchor.remove();
      }
      return;
    }
    if (data.type === "follow-up") {
      const prompt = data.prompt;
      if (
        typeof prompt !== "string" ||
        globalThis.navigator.userActivation?.isActive !== true
      ) {
        return;
      }
      const title = data.title;
      globalThis.prompt(typeof title === "string" ? title : prompt, prompt);
    }
  });
  channel.port1.start();
  const srcdoc = frame.dataset.srcdoc;
  if (srcdoc == null) {
    return;
  }
  globalThis.addEventListener("resize", () => {
    const height = Number.parseFloat(frame.style.height);
    if (!Number.isFinite(height) || height <= viewportHeight) {
      frame.style.removeProperty("height");
    }
    viewportHeight = globalThis.innerHeight;
    channel.port1.postMessage({ type: "measure" });
  });
  frame.addEventListener(
    "load",
    () => {
      frame.contentWindow?.postMessage(
        { type: "codex-visualization-initialize" },
        "*",
        [channel.port2],
      );
    },
    { once: true },
  );
  // Match the trusted bootstrap element, not the same text in an authored title.
  frame.srcdoc = srcdoc.replace(
    '<script type="application/json" id="codex-visualization-widget-state">__CODEX_VISUALIZATION_WIDGET_STATE__<\/script>',
    () =>
      '<script type="application/json" id="codex-visualization-widget-state">' +
      JSON.stringify(initialGlobals).replaceAll("<", "\\u003c") +
      "<\/script>",
  );
  delete frame.dataset.srcdoc;
})();
</script>
</body>
</html>
